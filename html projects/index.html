
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive HTML Projects</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 8%;
            color: #263B52;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .project {
            max-width: 450px;
            text-align: center;
        }

        .preview {
            background: #E8EDF3;
            aspect-ratio: 5 / 3;
            border-radius: 10px;
            overflow: hidden;
        }

        .preview iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        .project h3 {
            font-size: 16px;
        }

        .project a {
            color: #477CCB;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <h1>Interactive HTML Projects</h1>

    <p><a href="../">Back to Homepage</a></p>

    <div class="container">

        <div class="project">

            <div class="preview">
                <iframe
                    src="npv-analyzer/index.html"
                    title="NPV Analyzer"
                    scrolling="no">
                </iframe>
            </div>

            <h3>NPV Analyzer</h3>

            <a href="npv-analyzer/index.html" target="_blank">
                Open Interactive Website
            </a>

        </div>

    </div>

</body>
</html>
