
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive HTML Projects</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px 5%;
            color: #263B52;
            background-color: #FFFFFF;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px;
        }

        .project {
            width: 100%;
            text-align: center;
            background-color: #FFFFFF;
        }

        .preview {
            width: 100%;
            height: 600px;
            background-color: #FFFFFF;
            border-radius: 10px;
            overflow: hidden;
        }

        .preview iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #FFFFFF;
            display: block;
        }

        .project a {
            display: block;
            margin-top: 12px;
            color: #477CCB;
            text-decoration: none;
        }

        .project a:hover {
            text-decoration: underline;
        }

        /* Stack projects on smaller screens */
        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Interactive HTML Projects</h1>

    <p><a href="../">Back to Homepage</a></p>

    <div class="container">

        <!-- NPV Analyzer -->
        <div class="project">

            <div class="preview">
                <iframe
                    src="npvanalyzer/index.html"
                    title="NPV Analyzer Preview">
                </iframe>
            </div>

            <a href="npvanalyzer/index.html" target="_blank">
                Open NPV Analyzer
            </a>

            <a href="npvanalyzer/prompt.md" target="_blank">
                View Prompt
            </a>

        </div>

        <!-- Inventory Costing -->
        <div class="project">

            <div class="preview">
                <iframe
                    src="inventory-costing/index.html"
                    title="Inventory Costing Preview">
                </iframe>
            </div>

            <a href="inventory-costing/index.html" target="_blank">
                Open Inventory Costing
            </a>

            <a href="inventory-costing/prompt.md" target="_blank">
                View Prompt
            </a>

        </div>

    </div>

</body>
</html>
