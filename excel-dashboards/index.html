
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Dashboards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 8%;
            color: #304A3B;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 40px 30px;
        }

        .project {
            text-align: center;
            min-width: 0;
        }

        .preview {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 10px;
            background-color: #E8EDF3;
        }

        .preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .project h2 {
            font-size: 20px;
            margin: 15px 0 8px;
        }

        .project a {
            display: inline-block;
            margin-top: 4px;
            color: #477CCB;
            text-decoration: none;
        }

        .project a:hover {
            text-decoration: underline;
        }

        @media (max-width: 650px) {
            .projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Excel Dashboards</h1>

    <p><a href="../">Back to Homepage</a></p>

    <div class="container">

        <div class="projects">

            <div class="project">

                <div class="preview">
                    <img
                        src="customer-success/Customer%20Success%20Dashboard.png"
                        alt="Customer Success Dashboard">
                </div>

                <a href="customer-success/Interactive%20Dashboard%20Case%20V2.xlsx" download>
                    Download Excel Workbook
                </a>

            </div>

        </div>

    </div>

</body>
</html>
